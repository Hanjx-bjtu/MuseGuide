content: |
  告别、毕业、离别这类主题有稳定的情感结构：回忆 → 不舍 → 接受 → 向前。
  这一结构天然对应音乐上的三件事：
  一、调性与和声：主歌用小调或小调和弦承载「不舍」，
  副歌回到大调承载「接受与向前」，形成 `emotion.sad_to_hopeful.01` 描述的转向。
  二、速度与节奏：中慢速（60~85 BPM），和声节奏宽松，每小节一个和弦即可，
  给歌词留出叙述空间。
  三、曲式：主歌—副歌两段式即可满足 MVP 场景，不需要 bridge。
  副歌结尾使用完全终止（V → I）让「向前」的意味落地；
  若想保留一丝不舍，可用欺骗终止（V → vi）收尾。
  和弦选择上，I–V–vi–IV 或 vi–IV–I–V 都已足够 ——
  这类主题的难点在情绪走向的准确，而不在和声的新颖。
