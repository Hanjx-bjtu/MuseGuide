## 为什么单独写这一篇

`MVP计划.md` §3.1.2 给出的**唯一一个零基础示例**就是毕业主题：

> 我想写一首关于毕业的歌，有点伤感但最后是释然的感觉。

这是系统会被问到的第一个问题，因此值得有专门条目覆盖，
而不是让检索去拼凑「伤感」+「释然」两条通用知识。

## 情感结构 → 音乐手段

| 阶段 | 情感 | 音乐手段 |
|---|---|---|
| 回忆 | 平静、带距离 | 慢速、稀疏的和声节奏、中低音区 |
| 不舍 | 伤感 | 小调和弦、下行旋律 |
| 接受 | 释然 | 回到大调、上行旋律 |
| 向前 | 开阔 | 完全终止、音区抬高 |

## 常见写法

```text
主歌（回忆 / 不舍）：Am → F → C → G     中慢速，旋律偏低
副歌（接受 / 向前）：C → G → Am → F     音区抬高，结尾 V → I
```

## 要注意

`confidence_level` 标为 `medium` 而非 `high`：把「毕业」映射到具体的和声手法
属于项目自建的经验性映射，不是乐理上的必然，不同创作者会有不同选择。
