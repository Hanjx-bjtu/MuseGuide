## 为什么这样有效

听感上的「释然」来自两件事：**紧张感的解除**，以及**回到稳定的和声**。
小调和弦提供紧张，大调主和弦提供稳定。两者的先后顺序，就构成了「伤感→释然」。

## 常见配置

```text
主歌：Am → F → C → G      （从小调开始，偏伤感）
副歌：C → G → Am → F      （从大调开始，更开阔）
```

## 什么时候不适用

如果用户想要的是「一直很忧郁」，就不要做这个转向 —— 那属于
`emotion.melancholy.01`（纯小调色彩）的场景。
