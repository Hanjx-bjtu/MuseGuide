content: |
  「伤感但最后释然」是本项目最高频的复合诉求。它的技术本质是
  「小调色彩 → 大调色彩」的转向，而不是整首歌从小调改成大调。
  实现路径按改动成本从低到高：
  第一步，主歌使用小调和弦（Am、Dm、Em），副歌回到大调和弦（C、F、G）；
  第二步，在转折处使用 iv → I 或 V → I 的终止关系，让「释然」有落点；
  第三步，让旋律轮廓从下行转为上行，与和声转向同步。
  要避免的两种做法：整首停留在小调（听不到释然）；
  或过早进入大调（伤感的部分站不住，转折失去对比）。
