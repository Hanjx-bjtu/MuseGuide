layman_title: 让歌听起来「暖」
layman_content: |
  「暖」主要来自两件事：用听起来明亮的和弦，以及让和弦之间连得顺。
  具体做法很简单：多用大调的和弦（C、F、G 这类），
  给它们加个音会变得更柔和，再把低音排成一条平缓的线。
  反过来，突然冒出一个不属于这个调的和弦，暖意就会被打破。
content: |
  温暖感由三个层面共同构成：
  和声层面，以大三和弦与七和弦为主（I、IV、V、Imaj7、IVmaj7），
  避免过多的减和弦与强烈的调外和弦；
  低音层面，使用级进下行的低音线（C → G/B → Am → F/A），
  连贯的低音比跳跃的低音更「暖」；
  旋律层面，多停留在三音与五音上，减少尖锐的经过音。
  速度与音区同样参与：中慢速、中低音区听感更温暖。
  要避免的做法：连续使用多个调外和弦（调性模糊，温暖感消失）、
  整段转为小调（变成忧郁而非温暖）。
