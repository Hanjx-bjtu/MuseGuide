## 什么时候会用到

用户说「想要更温暖」「听起来太冷了」「想要治愈一点」。
这是仅次于「伤感」的高频诉求。

## 温暖的三个来源

| 层面 | 做法 | 反例 |
|---|---|---|
| 和声 | 大三和弦 + 七和弦 | 连续调外和弦 |
| 低音 | 级进下行 | 大跳低音 |
| 旋律 | 停留三音五音 | 尖锐经过音 |

## 与「忧郁但温暖」的区别

纯温暖：全程大调。
忧郁但温暖：**大调框架 + 局部小调色彩**（见 `emotion.sad_to_hopeful.01`）。
这是两个不同的目标，不能混为一谈 —— 用户说「温暖」时不要擅自加小调和弦，
那是自作主张；要先确认他是否也想要一点忧郁。
