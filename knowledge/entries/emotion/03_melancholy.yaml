content: |
  忧郁感由四类手段叠加实现：
  和声层面，使用小三和弦与小调（尤其 i、iv、VI 级）；引入小下属和弦 iv、
  使用 bVI 制造阴影色彩；采用叹息进行等下行低声线条。
  旋律层面，使用下行轮廓（模仿叹息）；停留在小三度与小六度音程上；
  运用延留音制造延迟与留恋感。
  节奏层面，使用较慢的速度与宽松的和声节奏，减少切分带来的动力。
  速度层面，中慢速（约 60-85 BPM）最有利于忧郁听感。
  微妙之处在于：纯粹的忧郁容易显得沉闷。若希望忧郁中带有温度，
  应保留大调框架（如 I、V 级仍在），只在局部引入小调色彩 ——
  这正是「忧郁但温暖」的技术路径。
