## 什么时候会用到

用户说「想要更伤感」「想丧一点」「失恋的歌」。
注意「伤感」与「忧郁」在中文里高度重叠，
但用户真正想要的往往不同：伤感偏叙事与释放，忧郁偏氛围与沉浸。

## 四个层面

| 层面 | 做法 | 效果 |
|---|---|---|
| 和声 | 小三和弦、iv、bVI | 柔和、低落 |
| 旋律 | 下行轮廓、小三度停留 | 叹息感 |
| 节奏 | 宽松、少切分 | 沉静 |
| 速度 | 60~85 BPM | 沉浸 |

## 与「伤感→释然」的关系

**忧郁是目的地，伤感→释然是过程。**
如果用户说「伤感但最后释然」，见 `emotion.sad_to_hopeful.01`；
如果说「一直很忧郁」「想沉浸在这种情绪里」，才是本条目。
混淆这两者会让系统给出「多余的转折」，破坏用户想要的氛围。
