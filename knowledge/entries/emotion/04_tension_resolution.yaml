## 什么时候会用到

用户说「副歌不够有情绪」「想要高潮感」「听完没什么感觉」。
这三句话指向同一个问题：**张力没有被建立起来，或者建立了却没被释放。**

## 匹配表

| 诉求 | 累积张力 | 释放 |
|---|---|---|
| 想要高潮 | pre-chorus 用 V 或调外和弦 | 副歌第一句回到 I |
| 想要收尾 | 副歌末尾停在 V | 结尾 V → I |
| 想要更激动 | 音区抬高、节奏加密 | 最后一句骤降 |

## 一个常被忽略的原则

**张力与释放必须配对，且距离不能太远。**
如果张力从主歌累积到全曲结尾才释放，中间的过程会显得冗长
（因为没有局部的「呼吸」）。因此成熟的写法是在每个乐句内都做一次小循环，
在主歌到副歌之间做一次大循环。

这条原则直接对应 `MVP计划.md` §3.5.3 的检索示例：
用户说「副歌听起来不够有情绪」，正确的检索方向是
Tension/Resolution + Cadence + Chord Progression + Melody Contour，
而不是「找更好的和弦」。
