layman_title: 先憋一口气，再呼出来
layman_content: |
  音乐让人激动，靠的是「憋住」和「放开」。
  憋住的办法：和弦停在不稳的地方、旋律往上走、节奏变密。
  放开的办法：回到稳的和弦、旋律落下来、节奏放松。
  如果一首歌从头到尾都没有「憋住」的时刻，
  它就不会有真正的高潮 —— 因为没有东西可以释放。
content: |
  张力（Tension）与释放（Resolution）是音乐情绪推进的底层机制。
  累积张力的手段：使用属功能与不稳定和弦（V、vii°）、引入调外音、
  提高音区、加密节奏、增加声部厚度、拉长乐句的期待。
  释放的手段：解决到主和弦（V → I）、旋律落回主音、降低音区、
  放缓节奏、减少声部。
  有效的做法是让张力与释放**在同一乐句内配对**：有悬念就必须有答案，
  否则听感会「悬空」。副歌前的 pre-chorus 是典型的张力累积段，
  副歌第一句是第一级释放，副歌结尾的终止式是最终释放。
