layman_content: |
  终止式就是音乐的「句号」。
  一首歌分成好几句，每句结束的时候，要用一种方式告诉听众
  「这句说完了」或者「还没说完」。
  用句号结束，听众会觉得这段落了地；
  用逗号结束，听众会期待下一句。
  如果你觉得歌的结尾「没落下来」，多半就是缺了这个句号。
content: |
  终止式（Cadence）是乐句结束处的和声公式，负责表达「结束感」的强弱。
  最直接的句号是「不稳的和弦接回稳的和弦」——
  也就是 V → I 这样的进行。
  若停在 V 上不解决，则像逗号，产生「还要继续」的期待。
  分段与分句都靠它：主歌结尾常用逗号（留悬念），
  副歌结尾常用句号（给满足）。
  对创作者最实用的一点：想让某个段落「有结束感」，
  就在最后两个和弦上做这个动作，不需要改动整段。
