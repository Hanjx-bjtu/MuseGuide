## 使用场景

这是 `MVP计划.md` §3.2.2 映射表里明确列出的一条：
用户说「想要收尾的感觉」→ 系统应映射到 `Cadence / 终止式`。

用户不会说「我想要终止式」，他只会说「感觉没说完」。
本条目就是这两句话之间的翻译。

## 表述规则（§3.8.3）

1. 类比：句号和逗号
2. 给出可执行的判断：*结尾停在不稳的和弦上 = 逗号，回到稳的 = 句号*
3. 落在 `MVP计划.md` §13 的示例写法上：

> 音乐里有一种叫「终止式」的东西，就像句号一样，
> 让听众感觉到「这一段结束了」。你的副歌结尾缺少这种「句号」。

**注意这里的表述顺序**：先描述问题（「没落下来」），
再引入术语（「终止式」），最后给动作（「加一个 G → C」）。
术语出现在解释之后，而不是之前 —— 这是零基础友好的关键。

## 零基础模式下的禁区

**不出现**：完全终止、半终止、变格终止、欺骗终止、K46。
这些分类对创作者的决策没有帮助，只会增加阅读负担。
需要这些区分的是 `harmony.cadence_function.01`（进阶文档）。
