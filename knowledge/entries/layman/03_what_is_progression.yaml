content: |
  和弦进行（Chord Progression）是和弦按时间顺序的排列，
  是一首歌的和声骨架。
  它决定三件事：情绪的走向（稳定还是紧张）、
  段落的划分（哪里是句号、哪里是逗号）、
  以及歌曲的整体性格。
  流行的和弦进行通常每小节换一个和弦，四个和弦构成一个循环。
  写法上不需要原创：`starter.common_progressions.01` 里的几套走向
  已经覆盖了绝大多数场景，新手从套用开始，比从零设计更快也更好听。
