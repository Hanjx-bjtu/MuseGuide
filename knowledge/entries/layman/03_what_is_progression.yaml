## 使用场景

用户看到起步方案里的 `Am → F → C → G`，不知道这串东西是干什么用的、
要不要按顺序弹、能不能换。

## 表述规则（§3.8.3）

1. 类比：说话的起承转合
2. 回答三个高频疑问：
   - **要按顺序吗？** 要，顺序就是它的意义
   - **能换吗？** 能，换掉一个往往就够了
   - **必须四个吗？** 不用，三个也常见
3. 落点：直接用现成的，想改再改

## 零基础模式下的禁区

**不出现**：功能圈、级数、T-S-D、和声节奏。

「级数」这个概念对零基础用户没有增益 —— 他们不需要知道 `Am` 是 `vi` 级，
只需要知道这个位置该放什么和弦（见 `layman.what_is_chord.01`）。
