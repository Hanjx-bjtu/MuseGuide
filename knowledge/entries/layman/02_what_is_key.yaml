content: |
  调性（Key）是一首作品围绕的中心音与音阶体系。
  它包含两个信息：主音（中心音，如 C）与调式（大调或小调）。
  大调（Major）听感明亮、开阔、稳定；
  小调（Minor）听感柔和、内敛、忧郁。
  因此「C 大调」读作：以 C 为中心音的明亮体系。
  调性的作用是为和弦提供参照：同一个和弦在不同调里承担的功能不同。
  例如 Am 在 C 大调里是 vi 级（稳定），在 A 小调里是 i 级（主和弦）。
  对创作者的实用含义：先定调性，再选和弦；
  换调不会改变歌曲的性格，只有换大小调才会。
