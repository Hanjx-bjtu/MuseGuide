## 使用场景

用户在起步方案里看到「调性：C 大调」，但不知道那是什么意思，
也不知道「为什么不是 D 大调」。

## 表述规则（§3.8.3）

1. 先给类比：基准色 / 画面的冷暖
2. 区分两件事：**高低由调决定，性格由大小调决定**
3. 落点：你不需要选，系统建议一个最容易上手的就行

## 零基础模式下的禁区

**不出现**：主音、音阶、调号、五度圈、关系大小调。

用户真正需要知道的只有一句：*大调明亮，小调忧伤，先按建议的来*。

## 为什么建议 C 大调

不是因为它最好听，而是因为它**解释成本与操作成本最低**：
钢琴上全是白键，用户想自己试的时候不需要学黑键。
起步阶段降低操作门槛比追求音色更重要（见 `starter.choosing_key_and_tempo.01`）。
