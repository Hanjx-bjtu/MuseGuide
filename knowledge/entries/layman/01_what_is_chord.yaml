layman_content: |
  把和弦想象成「同时按下去的几个音」。
  就像画画时，单色只能画线条，几种颜色叠在一起才成了丰富的画面。
  和弦就是音乐的「色彩」—— 不同的和弦组合，会让人感到不同的情绪：
  C 听起来明亮稳定（像晴天），Am 听起来柔和略带忧伤（像阴天）。
  你不需要会弹，只需要会选。
content: |
  和弦是「同时按下去的几个音」。
  就像画画时，单色只能画线条，几种颜色叠在一起才成了丰富的画面；
  和弦就是音乐的「色彩」—— 不同的和弦组合，会让人感到不同的情绪。
  C 大三和弦听起来明亮、稳定，像晴天；
  A 小三和弦听起来柔和、略带忧伤，像阴天。
  一首歌通常不会一直用同一个和弦，而是在几个和弦之间来回走，
  这个「走来走去」的序列就叫和弦进行。
