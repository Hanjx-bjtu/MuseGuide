## 使用场景

零基础用户在界面上看到「和弦」两个字，但不敢问。系统应在**用户第一次遇到该词时**
主动解释一次，而不是等他提问。

## 表述规则（对应 §3.8.3）

1. 先用一个日常类比（画画 / 颜色）
2. 再给一个正反对比（C 像晴天 / Am 像阴天）
3. 最后落到「所以你只需要选，不需要懂」

**不出现**：三度叠置、音程、根音、转位 —— 这些词在零基础模式下属于禁用术语。
