## 使用场景

用户问「为什么这样选」「我想让它听起来更 X，该怎么办」。
这是系统里最常被触发的一篇概念科普。

## 三对方向（系统的核心解释框架）

| 方向 | 手段 | 调这里 |
|---|---|---|
| 明 ↔ 暗 | 大小三和弦、调式 | 换和弦 |
| 上 ↔ 下 | 旋律轮廓、音区 | 改旋律 |
| 快 ↔ 慢 | 速度、和声节奏 | 调速度 |

## 为什么这个框架对零基础用户有效

它把「情绪」这个抽象目标，拆成了**三个用户可以直接操作的旋钮**，
而且每个旋钮都能用日常语言描述（亮/暗、上/下、快/慢），
不需要任何术语。

这与 `app/services/intent.py` 的映射逻辑是同一套认知模型：
用户说「想要更温暖」→ 规则层映射到「倾向大调和声」（调「明 ↔ 暗」旋钮）；
说「想要高潮感」→ 映射到「音域升高」（调「上 ↔ 下」旋钮）。
**知识库与代码共享同一个情绪模型**，这是输出能被用户理解的前提。

## 零基础模式下的禁区

**不出现**：协和与不协和、张力理论、调式色彩、心理声学。
用户需要的是旋钮，不是原理。
