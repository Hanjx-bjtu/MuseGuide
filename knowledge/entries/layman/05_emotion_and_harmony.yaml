layman_content: |
  音乐影响情绪，靠的是三样东西一起作用：
  和弦是明还是暗、旋律往上还是往下、速度快还是慢。
  想更明亮，就让和弦更「亮」、旋律往上走、速度稍快；
  想更低落，就反过来。
  你不需要懂原理，只要记住这个方向：亮 ↔ 暗、上 ↔ 下、快 ↔ 慢。
content: |
  情绪与音乐手段之间存在稳定的对应关系，可以归纳为三对可调的方向：
  明 ↔ 暗：由和弦性质与调式决定。大三和弦 / 大调偏明亮，
  小三和弦 / 小调偏暗，借用的调外和弦提供额外的色彩。
  上 ↔ 下：由旋律轮廓与音区决定。上行与高音区偏激动、开阔；
  下行与低音区偏低落、内敛。
  快 ↔ 慢：由速度与和声节奏决定。快速与密集偏活跃、紧张；
  慢速与宽松偏沉静、抒情。
  这三对方向**同向变化时效果最强**：
  同时变亮、变上、变快，听感就是明确的「振奋」；
  若只改其中一项，变化会显得含糊。
  这也解释了为什么「伤感→释然」需要和声与旋律同时转向。
