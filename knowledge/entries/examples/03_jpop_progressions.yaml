## 什么时候会用到

用户说「想要日系一点」「想要 City Pop 的感觉」「想要有都市感」。
这类诉求无法靠「更温暖 / 更伤感」这类通用情绪词覆盖，需要风格专属的知识。

## 三套典型走向

| 名称 | 和弦 | 特征 |
|---|---|---|
| 王道进行 | Fmaj7 G7 Em7 Am | 从下属起，明亮中带惆怅 |
| 小室进行 | Am F G C | 从忧郁转向开阔 |
| Just the Two of Us | Fmaj7 Em7 Am C | 松弛、都市夜晚感 |

## 与流行走向的差别

以 `C | G | Am | F`（I–V–vi–IV）为对照：

- 起点不同：日系常从 **IV** 或 **vi** 开始，而非 I
- 和弦质量不同：三和弦 → **七和弦**
- 连接方式不同：直线功能进行 → **加入副属和弦绕路**

这三点共同产生了「日系感」。因此 P4 给这类用户的建议，
重点应放在**和弦质量与连接方式**上，而不是替换整个走向。

## 确定性说明

`confidence_level` 为 `medium`：这些进行的命名与归属在不同资料中有差异，
且「日系感」本身是主观风格标签。本条目的价值在于提供**可操作的候选方案**，
而不是给出严格的乐理分类。
