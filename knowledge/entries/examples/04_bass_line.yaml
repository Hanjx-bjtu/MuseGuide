  每次换和弦时，最低的那个音也在走。
  如果它一步一步往下走（而不是跳来跳去），整首歌会听起来更连贯，
  像一条线把几个和弦串起来了。
  最省事的做法：不用改和弦本身，只改最低音。
  比如把 G 换成 G/B，别的都不动。
content: |
  低音线（Bass Line）是听感连贯性的主要来源，也是改动成本最低的增色手段之一。
  级进下行：C → G/B → Am → F/A → Fm/Ab → C。
  低音依次为 C → B → A → A → Ab → C，形成一条平滑下行的线条，
  在保持和声功能不变的前提下显著提升「设计感」。
  持续音（Pedal Point）：低音长时间停留在同一个音上（如持续 C），
  上方和弦变化，产生张力累积，常用于前奏与副歌前的铺垫。
  上行低音：C → C/E → F → F/A → G，逐步抬升，产生推进感。
  跳进低音：低音做四度或五度跳进（C → G → Am → F 的默认形态），
  功能清晰但连贯性弱 —— 这也是 `C | G | Am | F` 听起来「普通」的原因之一。
