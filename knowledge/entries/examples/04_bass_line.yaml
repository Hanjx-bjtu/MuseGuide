## 什么时候会用到

用户说「想要更连贯」「听起来有点断」「想让和弦连起来」。
这是「感觉普通」的第二大原因（第一是走向太常见）。

## 三种低音运动

| 类型 | 示例 | 听感 | 改动量 |
|---|---|---|---|
| 级进下行 | C → G/B → Am → F/A | 平滑、有设计感 | 极小 |
| 持续音 | C 持续 + 上方变化 | 累积张力 | 小 |
| 上行 | C → C/E → F → G | 推进感 | 极小 |
| 跳进（默认） | C → G → Am → F | 功能清晰但平 | — |

## 为什么这是最值得推荐的方案

在 `MVP计划.md` §3.9.3 的进阶示例里，「改变低音走法」被列为三个建议方向之一。
它值得被优先推荐，原因是：

1. **改动量极小** —— 用户不需要重新学和弦，只是换个按法
2. **和声功能完全不变** —— 不会破坏用户已经满意的部分
3. **听感变化明显** —— 投入产出比最高

这与 `harmony.chord_color.01` 里「先给低风险方案」的原则一致。
