  如果你的和弦听起来「还行但没什么特别」，通常不是写错了，
  而是用得太常见了。
  这里有几套用得很多的搭配。你可以：
  给和弦加个音（更柔和）、换掉最后一个和弦（多一丝忧伤）、
  或者让低音一步步往下走（更连贯）—— 都只改一点点，但听感会明显不一样。
content: |
  以下为流行 / 抒情歌中高频出现的和弦进行（事实性数据进行整理，不含受版权保护的乐谱）。
  C → G → Am → F（I–V–vi–IV）：使用最广的走向之一，稳定、通用、好记。
  Am → F → C → G（vi–IV–I–V）：同一条走向的旋转，从伤感切入，落点更开阔。
  C → G/B → Am → F/A：低音级进下行，听感更连贯、更「有设计感」。
  C → G → Am → Fm：最后一步借用平行小调的 iv，加一层阴影。
  Cmaj7 → G/B → Am7 → Fmaj7：功能关系不变，但色彩明显更柔和。
  用途：当用户说「我的和弦听起来很普通」时，这些是可直接对比的候选方案。
