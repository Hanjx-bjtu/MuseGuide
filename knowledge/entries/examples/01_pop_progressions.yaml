## 怎么用这一篇

进阶用户输入 `C | G | Am | F` 并说「太普通了」时，系统给出修改方向，
其中每一条都应当能对应到本条目里的一行 —— **这样建议才有依据，而不是模型的自由发挥。**

## 三条改动的性质差异

| 方案 | 改动量 | 听感变化 | 风险 |
|---|---|---|---|
| Cmaj7 / G/B / Am7 / Fmaj7 | 小 | 更柔和梦幻 | 低 |
| C / G / Am / Fm | 极小 | 多一层阴影 | 低 |
| 低音级进下行 | 小 | 更连贯 | 低 |

三个方向都在「保持温暖」的约束内 —— 这正是用户提出的目标。
