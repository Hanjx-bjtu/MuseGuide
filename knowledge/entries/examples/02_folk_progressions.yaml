layman_content: |
  民谣的和弦通常很简单，一般就三四个来回用。
  最常见的是「一 → 四 → 五 → 一」，听起来像把事情从头讲到尾。
  段落之间的变化也不大，靠歌词和演唱来推动。
  所以如果你想写民谣，和弦不用复杂，简单反而更对味。
content: |
  民谣的和声特点是用和弦少、功能清晰、坚持使用三和弦。
  I → IV → V → I（C → F → G → C）：最经典的民谣走向，
  功能完整，有明确的起承转合，常用作整段的主干。
  I → V → vi → IV（C → G → Am → F）：更偏流行化的民谣，副歌常用。
  vi → IV → I → V（Am → F → C → G）：从小调切入，带一点忧郁的民谣叙事。
  I → IV → I → V（C → F → C → G）：半终止收尾，产生「还要继续」的推进感，
  适合主歌段落衔接。
  编配上，民谣常用分解和弦（指弹）而非柱式和弦，且和声节奏较宽松。
  增色手段以加音（Cadd9、Gsus4）和低音级进为主，
  较少使用调式借用与副属和弦 —— 那会削弱民谣的朴素感。
