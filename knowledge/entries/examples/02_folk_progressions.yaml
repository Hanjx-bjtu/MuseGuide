## 什么时候会用到

用户在意图里提到「民谣」「吉他」「弹唱」，或选择了风格选项「温柔民谣」。

## 四套走向

| 走向 | 和弦 | 听感 | 用途 |
|---|---|---|---|
| I–IV–V–I | C F G C | 完整、叙事 | 整段主干 |
| I–V–vi–IV | C G Am F | 流行化 | 副歌 |
| vi–IV–I–V | Am F C G | 忧郁叙事 | 主歌 |
| I–IV–I–V | C F C G | 悬而未决 | 段间衔接 |

## 民谣的增色原则

**改动越小越像民谣。** 调式借用（Fm）和副属和弦（E7）在民谣里会显得「用力过猛」。
推荐只用：加音（Cadd9、Gsus4）、低音级进、以及分解和弦的节奏变化。

这条判断直接服务于 P4 的建议生成：当用户选择民谣风格时，
应优先给出**低改动量**的方案，而不是把流行 / 爵士的手法套过来。
