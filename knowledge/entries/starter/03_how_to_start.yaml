## 什么时候会用到

用户说「我想写歌但完全不知道从哪开始」。
这是 `MVP计划.md` §3.2 里用户典型问题 A，也是 Creative Starter 的触发条件。

## 四个决定

| # | 决定 | 用户怎么回答 | 系统怎么处理 |
|---|---|---|---|
| 1 | 情绪 | 「有点伤感」 | 映射到调性倾向与和弦色彩 |
| 2 | 速度 | 「像散步那样」 | 映射到 BPM |
| 3 | 调性 | 通常由系统建议 | 给 C 大调 / A 小调 + 通俗理由 |
| 4 | 和弦 | 「你帮我定」 | 从常见走向里选一组 |

## 为什么是这四个

它们**都能用日常语言回答**，且**回答完就足以产生可听的东西**。
任何需要乐理才能回答的问题（「你想用什么级数？」）都不应该出现在第一步。

这条原则来自 `MVP计划.md` §3.10.2 的界面草案：首页只有一句话输入框 +
几个大方向按钮，没有任何技术字段。界面形状本身就是这条原则的体现。
