content: |
  零基础用户的第一步不是「学会乐理」，而是做出四个可回答的决定。
  一、情绪：这首歌想让人感觉到什么？这决定调性倾向与和弦色彩。
  二、速度：像翻相册（60）、像散步（82）、还是像走路（100）？这决定整体气质。
  三、调性：建议从 C 大调或 A 小调开始 —— 黑键最少，最容易在琴上试，
  解释成本也最低。
