## 为什么需要这一篇

`MVP计划.md` §9 的成功标准第 9 条是「输出结果对零基础用户具有实际参考价值」。
「实际」的含义是**用户看完知道下一步做什么**，而不只是看懂了一段解释。

常见的失败模式：系统给出了漂亮的调性与和弦建议，
用户点头表示理解，然后关掉页面 —— 因为不知道从哪动手。
本条目就是为了堵这个缺口。

## 三步落地

| 步骤 | 做什么 | 判断标准 |
|---|---|---|
| 1 熟悉和声 | 循环弹/哼和弦 | 走向听感符合预期 |
| 2 叠加旋律 | 在和弦上自由哼唱 | 有能重复的片段 |
| 3 筛选记忆点 | 挑出最难忘的一句 | 隔天还能想起来 |

## 落在哪一步会卡住

- 卡在第 1 步：和弦听着别扭 → 属于和声问题，回退到和弦建议
- 卡在第 2 步：哼不出旋律 → 属于旋律问题，见 `melody.contour.01`
- 卡在第 3 步：记不住任何一句 → 属于动机问题，见 `melody.motif_development.01`

**这条「卡在哪一步 → 查哪类知识」的映射，正是 P4 建议生成需要的推理路径。**

