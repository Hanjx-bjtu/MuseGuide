layman_title: 有了和弦之后，下一步做什么
layman_content: |
  拿到几个和弦之后，不要急着追求完美。
  先按顺序把它们循环弹（或哼）几遍，感受一下走向；
  然后随便哼一段旋律盖在上面，不用管好不好听；
  最后挑出你还记得住的那一句，把它留下来当副歌。
  第一版的目标是「有东西」，不是「好听」。
content: |
  起步方案给出的是骨架，落地需要三步：
  一、熟悉和声：把和弦按顺序循环，每个和弦持续一到两小节，
  确认走向的听感符合预期。若某个和弦听着别扭，先换掉它，
  而不是调整其它部分。
  二、叠加旋律：在和弦上自由哼唱，优先使用和弦音（根音、三音、五音）作为
  落点，经过音可以随意。不需要一开始就写谱。
  三、筛选记忆点：反复几遍后，挑出最容易记住的那一句作为副歌核心，
  其余部分围绕它展开。
  关键心态：第一版的目标是产出**可修改的初稿**，而不是成品。
  所有后续建议都建立在「已经有东西」之上 —— 从零改起远比修改初稿困难。
