## 什么时候会用到

`MVP计划.md` §3.3.3 的起步方案输出结构里，`sections` 数组就是主歌与副歌两段 ——
本条目是那个字段的知识依据。

## 段落一览

| 段落 | 作用 | 音区 | 是否必须 |
|---|---|---|---|
| 前奏 | 建立氛围 | — | 否 |
| 主歌 | 叙述 | 较低 | ✅ |
| 预副歌 | 累积张力 | 渐升 | 否 |
| 副歌 | 情绪高点 | 较高 | ✅ |
| 桥段 | 提供对比 | 变化 | 否 |
| 尾奏 | 收束 | — | 否 |

## 主歌与副歌必须有区别

最常见的「不像一首歌」的原因，就是主歌和副歌听起来差不多。
三个可区分的维度（满足一个即可）：

1. **音区**：副歌整体抬高
2. **和声起点**：主歌从小调开始，副歌从大调开始
3. **和声节奏**：副歌的和弦换得更快

`MVP计划.md` §3.3.3 的示例同时用了前两个维度。
