layman_title: 一首歌是由几段拼起来的
layman_content: |
  歌不是一口气唱完的，它分成几段。
  最常见的是「主歌 + 副歌」：主歌像在讲故事，比较平；
  副歌是反复出现、最好记的那一句。
  主歌可以有好几段，副歌通常反复用同一段。
  你的第一首歌，写好这两段就够了。
content: |
  流行歌的基本结构由若干段落组成，最核心的是两段：
  主歌（Verse）：叙述、铺垫，旋律音区较低、和声较平，可重复多段。
  副歌（Chorus）：情绪高点、记忆点，旋律音区较高，
  通常反复使用同一段和声与旋律。
  常见的扩展段落：前奏（Intro）建立氛围；
  预副歌（Pre-Chorus）累积张力，指向副歌；
  桥段（Bridge）在第三次副歌前提供对比；
  尾奏（Outro）收束。
  对零基础用户，建议只做主歌 + 副歌两段：
  一是降低决策成本，二是这两段已经足以构成完整听感。
  主歌与副歌的差异应当明显 —— 至少在音区或和声起点上有一个不同，
  否则听众分不清「哪句是副歌」。
