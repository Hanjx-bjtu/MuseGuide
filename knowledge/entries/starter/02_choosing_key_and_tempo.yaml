## 为什么建议 C 大调

不是因为 C 大调最好听，而是因为**它的解释成本最低**：
用户如果想自己在钢琴上试，C 大调全是白键。起步阶段降低操作门槛比追求音色更重要。

## 速度的通俗参照

| 用户说法 | BPM | 参照 |
|---|---|---|
| 很慢 | 60 | 像翻相册 |
| 中等偏慢 | 82 | 像散步 |
| 中等 | 100 | 像走路 |
| 偏快 | 120 | 像赶路 |

这些参照直接来自 `MVP计划.md` §3.10.3 的界面文案，**必须保持一致** ——
用户在界面上看到的说法和系统解释里用的说法若是两套，会造成困惑。
