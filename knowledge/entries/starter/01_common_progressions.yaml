## 用途

这是 Creative Starter 模式下最常被检索到的一篇 —— 当用户说
「我想写一首歌但不知道从哪开始」时，系统需要的正是这张表。

## 选择逻辑

```text
用户想要温暖 / 释然  →  I → V → vi → IV
用户想要伤感起步      →  vi → IV → I → V
用户想要简单朴素      →  I → IV → V → I
用户想要丰富色彩      →  IVmaj7 → V7 → iii7 → vi
```

## 为什么只给四个和弦

四个和弦足够支撑一段主歌或副歌。给更多会超出零基础用户当场能消化的量，
也违背 `MVP计划.md` §1.3「不做自动生成完整歌曲」的边界。
