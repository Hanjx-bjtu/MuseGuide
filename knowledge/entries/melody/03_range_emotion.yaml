## 什么时候会用到

用户说「副歌不够高」「感觉唱不上去」「想让情绪更强烈」，
或者反过来「太吵了，想安静一点」。

## 速查

| 用户诉求 | 做法 |
|---|---|
| 副歌更突出 | 副歌整体抬高音区，主歌保持在舒适区 |
| 更沉静 | 整体下移，减少跳进 |
| 更口语化 | 缩小音域到六度内，多用同音反复 |
| 更激动 | 扩大音域，加入向上的跳进 |

## 零基础用户的现实约束

§1.3 的 MVP 边界里不含演唱能力评估，但起步方案仍应**默认选择窄音域**
（`E4`~`A4` 这类六度内），因为用户第一次写歌大概率要自己唱。
音域过宽会让「能写出来」变成「唱不出来」，直接损害 §9 第 9 条的「实际参考价值」。
