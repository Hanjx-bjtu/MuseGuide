layman_title: 唱得高一点，还是低一点
layman_content: |
  同一段旋律，唱高一点会显得更激动、更用力；
  唱低一点会更沉静、更接近说话。
  如果整首歌都挤在中间几个音里，听感会比较平；
  如果只在副歌冲上去，那一下就会特别明显。
  所以「哪里高、哪里低」本身就是一种表达。
content: |
  音域（Range）是旋律的最低音到最高音的距离，音区（Tessitura）是主要停留的区域。
  音域窄（六度以内）听感集中、口语化，适合主歌叙述与零基础起步；
  音域宽（十度以上）表现力强，但需要演唱能力支撑。
  音区整体偏高 → 明亮、紧张、年轻；整体偏低 → 沉稳、厚重、忧郁。
  最实用的手法是「音区对比」：主歌保持在舒适的中低音区，
  副歌整体抬高，用音区落差制造情绪推进，而不必依赖更大的音量。
