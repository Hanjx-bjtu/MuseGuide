## 用户会怎么问

「想要高潮感」「想要收尾的感觉」「感觉唱到一半没劲了」。

## 三个可调的旋钮

| 想要的听感 | 做法 |
|---|---|
| 更紧张 | 音更高、跳进更大、节奏更密 |
| 更放松 | 回到低音、级进、放慢、停在稳定音 |
| 高潮 | 全曲最高音放在副歌第一句 |
| 收尾 | 最后一句下行回到主音 |

## 与和声的配合

旋律的释放最好与和声的终止同时发生（旋律落回主音 + 和弦进行 V → I），
两者分开做会显得「没说完」。
