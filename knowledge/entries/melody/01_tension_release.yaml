layman_content: |
  把旋律想象成说话的语气：音越高、跳得越远、唱得越密，就越紧张；
  回到较低的音、一步步走、慢下来，就越放松。
  最简单的做法是让旋律先往上走到整首歌的最高点（高潮），
  再慢慢走回开始的地方 —— 听起来就像把一件事讲完了。
content: |
  旋律的「紧张感」主要来自三个可操作的维度：音高位置、跳进幅度、节奏密度。
  音高越高越紧张；向上跳进比级进更紧张；节奏越密集越紧张。
  释放则相反：回到较低的音、用级进、放慢节奏、并在稳定音级上停留。
  实操上最简单的手法叫「拱形轮廓」：旋律先上行到最高点（高潮），
  然后下行回到起始音附近。听众会自然感到「讲完了一件事」。
