## 什么时候会用到

用户说「副歌和主歌不像一首歌」「旋律听起来很散」，
或者反过来「重复太多了，听着腻」。

## 四种手法

| 手法 | 做法 | 效果 | 风险 |
|---|---|---|---|
| 重复 | 原样再来一次 | 强化记忆 | 连续 >3 次会呆板 |
| 模进 | 整体移高/移低 | 推进感、高潮 | 移得过多会脱离调性 |
| 变奏 | 改节奏或个别音 | 新鲜感 | 改动过大则失去统一 |
| 扩展 | 尾部接新材料 | 转折、收束 | 容易变成两首歌 |

## 与 §3.4.2 的旋律输出衔接

`MVP计划.md` §3.4.2 的分析结果里有 `repetition: true/false` 字段 —— 它检测的正是这里说的
「重复」。当 `repetition` 为真时，系统可以据此建议用户用**模进**把已有的动机抬升成副歌，
这比建议「重新写一段旋律」要友好得多，因为它承认了用户已经写出来的东西。
