layman_title: 一个短句子，变着花样用
layman_content: |
  好记的旋律通常都有一个很短的「核心句」，比如三四个音。
  整首歌其实就是把这个短句翻来覆去地用 —— 升高一点、降低一点、
  拉长一点、接上一点新东西。
  这样听众既觉得熟悉（好记），又不会觉得重复（耐听）。
content: |
  动机（Motif）是旋律中最短的、可识别的单位，通常 2~5 个音。
  发展手法主要有四种：
  重复（Repetition）：原样再现，强化记忆，但连续超过三次会显得呆板。
  模进（Sequence）：把动机整体移高或移低若干音级重复，产生推进感，
  是流行歌副歌最常用的手法。
  变奏（Variation）：改变节奏或个别音，保持轮廓，产生新鲜感。
  扩展（Extension）：在动机尾部接上新材料，用于乐句的收束或转折。
  实操建议：主歌用一个动机反复，副歌用模进把同一个动机抬升成高潮，
  这样全曲的统一性来自同一个素材，而不是靠堆砌。
