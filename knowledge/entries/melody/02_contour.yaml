layman_content: |
  旋律往上走，听起来会更有精神、更开阔；
  往下走，听起来会低沉、像叹气。
  先上后下像波浪，是最好记也最自然的一种；
  一直重复同一句，会让人印象深刻，但也容易腻。
  你只需要决定：这首歌的主线，是往上还是往下。
content: |
  旋律轮廓（Contour）指音高随时间的整体走向，是情绪最直接的载体。
  上行轮廓常与「希望、推进、高潮」关联；下行轮廓常与「叹息、低落、告别」关联。
  拱形轮廓（先上后下）最能给人「讲完一件事」的完整感，是抒情歌的主流选择。
  倒拱形（先下后上）产生「由抑到扬」的效果，适合「伤感→释然」这类复合情绪。
  平直轮廓（同音反复）记忆点强但推进力弱，通常用在主歌的叙述段。
  实操上，把曲中最高音安排在副歌的第一句，是提升副歌存在感最省力的做法。
