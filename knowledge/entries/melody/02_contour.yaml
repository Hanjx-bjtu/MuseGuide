## 什么时候会用到

用户说「副歌不够突出」「旋律听起来闷」「想要更有起伏」时，
先看轮廓，往往不用改和声。

## 四种基本轮廓

| 轮廓 | 形状 | 常见情绪 | 典型用法 |
|---|---|---|---|
| 上行 | ↗ | 希望、推进 | 副歌开头、高潮铺垫 |
| 下行 | ↘ | 叹息、低落 | 主歌、告别句 |
| 拱形 | ↗↘ | 完整、诉说 | 抒情歌主歌 |
| 倒拱形 | ↘↗ | 由抑到扬 | 伤感→释然 |

## 与「伤感→释然」的配合

`MVP计划.md` §3.3.3 的示例正是这个场景：主歌用下行/拱形轮廓表达伤感，
副歌转为上行轮廓表达释然。**轮廓与和声同向变化时，转折感最强**；
若和声转了但旋律没转，用户会说「感觉没变过来」。
