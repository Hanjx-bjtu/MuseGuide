## 什么时候会用到

用户说「想在副歌前推一下」「想让它更有推进感」「感觉太平了」时，
副属和弦是最直接的手法之一。

## 常用副属和弦（C 大调）

| 标记 | 实际和弦 | 指向 | 听感 |
|---|---|---|---|
| V/vi | E7 | Am | 强烈的推进，常用于副歌前 |
| V/IV | C7 | F | 松弛中带一点蓝调味 |
| V/V | D7 | G | 双重推进，张力更强 |

## 与调式借用的区别

两者都会引入调外音，但目的不同：

- **副属和弦**：制造**指向性**（强烈想要解决到某个和弦）
- **调式借用**：制造**色彩**（不强调解决，只是换了一种颜色）

用户说「想要推进感」→ 副属；说「想要更温暖 / 更忧伤」→ 借用。

## 要注意

副属和弦后面**应当解决到它指向的和弦**。若解决到别处，听感会变成「跑调」
而不是「色彩」——这是初学者最常见的误用。
