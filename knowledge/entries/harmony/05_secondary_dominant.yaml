content: |
  副属和弦（Secondary Dominant）是某个非主和弦的属和弦，用 V/x 标记，
  读作「x 的属和弦」。它临时把目标和弦当作「临时主音」，制造局部紧张。
  在 C 大调中最常用的是 V/vi（E 或 E7 → Am）和 V/IV（C7 → F）：
  E7 本不属于 C 大调（含 G#），但它强烈指向 Am，因此听起来是「借来的紧张」。
  使用要点：副属和弦通常解决到它指向的和弦；它引入调外音，因此色彩鲜明，
  一次用一到两个就够，用多了会让调性模糊。
