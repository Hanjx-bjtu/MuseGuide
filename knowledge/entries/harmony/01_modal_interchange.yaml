## 什么时候会用到

用户说「想要更温暖，但不要太普通」「想加一点忧伤的影子」时，最直接的答案就是借用和弦。
它是「改动成本最低、听感变化明显」的手法：只改一个音，情绪就多一层。

## 常见借用

| 借用和弦 | 罗马数字 | 听感 |
|---|---|---|
| Fm | iv | 一丝忧伤、阴影 |
| Ab | bVI | 宽广、电影感 |
| Bb | bVII | 松弛、民谣感 |
| Eb | bIII | 明亮中带一点阴郁 |

## 要注意

连续使用调外和弦会让调性模糊。**一次只借一个，并让它回到主调的和弦上**，效果最稳。
