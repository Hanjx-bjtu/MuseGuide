content: |
  Modal Interchange 指从同主音的其他调式借用和弦。以 C 大调为例，可从
  C 小调借用 Fm、Ab、Bb、Eb 等和弦。借来的和弦带有原调式的色彩，
  因此能在不改变整体调性的前提下引入新的听感层次。
  Fm（iv）是最常用的借用和弦之一：它只把 F 和弦的三音 A 降低半音到 Ab，
  改动极小，但会立刻带来一层阴影感。
  使用要点：借用和弦通常出现在乐句的弱拍或不稳定位置；
  若连续使用多个调外和弦，调性会变得模糊，反而失去「借用」的效果。
