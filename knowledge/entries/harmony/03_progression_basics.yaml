layman_title: 和弦为什么会「想回家」
layman_content: |
  和弦不是随便排的。有的和弦听起来「稳」，像站在地上；
  有的听起来「悬着」，像话说到一半。
  写歌就是把「稳」和「悬」交替着用：先让你悬一下，再稳稳落回来。
  所以你会觉得某些和弦总「想」接在另一些和弦后面 —— 那不是巧合，
  是它本来就悬着，需要一个稳的和弦把它接住。
content: |
  和弦进行建立在「稳定—不稳定—解决」的循环上。
  三个功能组：主功能（Tonic，I / vi）稳定；属功能（Dominant，V / vii°）最不稳定，
  强烈要求解决；下属功能（Subdominant，IV / ii）中度不稳定，起过渡作用。
  最常见的运动是 T → S → D → T：离开稳定，经过过渡，制造紧张，然后解决。
  这也是为什么 V → I 听感上像「句号」，而 I → V 像「逗号」。
  进行的选择本质上是在决定：紧张感从哪里来、在哪里释放、释放得彻不彻底。
