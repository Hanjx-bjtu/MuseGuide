## 什么时候会用到

用户问「为什么这里要接这个和弦」「为什么我的进行听起来没结束」时，
答案通常落在功能逻辑上，而不是「这个和弦更好听」。

## 三个功能组

| 功能 | 和弦（C 大调） | 听感 | 作用 |
|---|---|---|---|
| 主 Tonic | C、Am | 稳、落地 | 起点与归宿 |
| 下属 Subdominant | F、Dm | 中度不稳 | 过渡、铺垫 |
| 属 Dominant | G、E、Bdim | 悬、要解决 | 制造紧张 |

## 运动的常规路径

```text
T → S → D → T     （最典型：C → F → G → C）
T → D → T         （最直接：C → G → C）
T → S → T         （无紧张感，听感平稳）
```

**反向走（D → S）会让听感「倒退」**，这是很多「感觉不对劲」的实际原因。
