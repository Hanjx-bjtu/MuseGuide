content: |
  在三和弦之上再叠一个三度音就得到七和弦。它比三和弦多一层「未解决」的听感，
  因此常用于需要柔和、梦幻或爵士色彩的场景。
  常用的四种：Cmaj7（大七，柔和明亮）、Am7（小七，柔和忧伤）、
  G7（属七，紧张、要求解决）、Dm7（小七，铺垫感强）。
  七和弦不会改变和弦的功能关系 —— Cmaj7 仍然是 I 级，仍然稳定，
  只是听感比 C 更「软」一点。这是「保持原样但更有味道」的最省力做法。
