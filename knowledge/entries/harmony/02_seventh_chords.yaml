## 什么时候会用到

用户说「听起来不错，但有点普通 / 想更梦幻一点 / 想更有质感」，
而**不想改变和弦走向**时，加七音是改动成本最低的方案。

## 三和弦 → 七和弦 对照

| 原和弦 | 加七音后 | 听感变化 |
|---|---|---|
| C | Cmaj7 | 更柔和、更梦幻 |
| Am | Am7 | 更松弛 |
| F | Fmaj7 | 更绵长 |
| G | G7 | 更紧张（需要解决回 C） |

## 要注意

**七个音以上的延伸音（9、11、13）在零基础场景下不必引入** ——
它们对听感的影响更细微，但解释成本高得多。MVP 阶段到七和弦为止。
