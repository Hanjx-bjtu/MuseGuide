## 什么时候会用到

这是「感觉普通但想保持温暖」这类需求的总入口。
`MVP计划.md` §3.9.3 的进阶示例给出的建议 A（七和弦）与建议 B（借用和弦）
分别对应下面的手法一和手法三。

## 四种手法的对比

| 手法 | 示例 | 改动量 | 听感变化 | 风险 |
|---|---|---|---|---|
| 一、加音 | C → Cmaj7 | 极小 | 更柔和、梦幻 | 低 |
| 二、换低音 | C → G/B | 极小 | 更连贯 | 低 |
| 三、替换 | F → Fm | 小 | 多一层阴影 | 中 |
| 四、插入 | C → E7 → Am | 中 | 推进感明显 | 中 |

## 给用户的排序原则

**先给低风险方案。** 用户的目标通常是「保留我喜欢的部分，只改掉不喜欢的那一点」，
而不是「重写」。把改动量当作建议排序的第一依据，比把「理论上有趣」放第一更贴合需求。
