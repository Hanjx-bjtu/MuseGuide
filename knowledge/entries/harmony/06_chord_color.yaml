content: |
  在保持原有功能关系的前提下增加和声色彩，有四种改动成本递增的手法：
  一、加音（Extension）：三和弦变七和弦（Cmaj7），或加九音（Cadd9）。
  改动最小，听感变柔和、梦幻，功能关系完全不变。
  二、换低音（Inversion / Bass Line）：C → G/B → Am → F/A，低音级进下行，
  增加连贯性与「设计感」，和声实质不变。
  三、替换（Substitution）：把 IV 换成 iv（调式借用），或把 I 换成 iii，
  引入新的色彩但不破坏框架。
  四、插入（Insertion）：在目标和弦前插入副属和弦（V/vi），制造局部推进。
  排序建议：先试一、二，它们几乎不会「改坏」；三、四的听感变化更明显，
  需要确认用户是否接受更大幅度的改动。
