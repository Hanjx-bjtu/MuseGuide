layman_content: |
  说话有句号和逗号，音乐也有。
  一个「悬着」的和弦接回「稳」的和弦，听起来就像句号，让人感觉这段结束了；
  如果停在悬着的和弦上，就像逗号，会让人觉得「还没说完」。
  你的歌结尾要是感觉「没落下来」，通常就是缺了这个句号。
content: |
  终止式是乐句结束时的和声公式，决定「结束感」的强弱。
  完全终止（Authentic Cadence）：V → I，最典型的句号。若 V 与 I 均为原位且
  旋律落在主音上，称为完全终止；否则为不完全终止，结束感稍弱。
  半终止（Half Cadence）：停在 V 上，像逗号，要求继续。
  变格终止（Plagal Cadence）：IV → I，柔和、常用于结尾的「阿门」感。
  欺骗终止（Deceptive Cadence）：V → vi，期待解决却转到小调，产生意外与失落感。
  实操上：想让副歌「落下来」用 V → I；想留悬念用半终止；
  想让结尾带一点惆怅，用欺骗终止。
