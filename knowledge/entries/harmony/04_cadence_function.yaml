## 什么时候会用到

用户说「结尾感觉没说完」「副歌结束了但好像还悬着」「想更有收尾的感觉」——
这几句话指向的都是终止式，而不是和弦本身不好听。

## 四种终止式

| 终止式 | 写法 | 听感 | 适用 |
|---|---|---|---|
| 完全终止 | V → I | 句号，最确定 | 副歌结尾、全曲结尾 |
| 半终止 | 停在 V | 逗号，要接下去 | 主歌结尾、铺垫 |
| 变格终止 | IV → I | 柔和、安稳 | 结尾的余韵 |
| 欺骗终止 | V → vi | 意外、失落 | 想留一丝惆怅 |

## 与旋律的配合

终止的「确定感」不只来自和声：**旋律落在主音上**才算真正说完。
和声给了 V → I，但旋律停在三音上，听起来仍会「差一点」。
